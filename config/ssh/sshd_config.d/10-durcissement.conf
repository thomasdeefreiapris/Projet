# /etc/ssh/sshd_config.d/10-durcissement.conf
# Copié par installer.sh, validé par "sshd -t" avant redémarrage (S5).
# Debian lit ce dossier AVANT le reste de sshd_config, et pour chaque option
# c'est la PREMIÈRE valeur lue qui s'applique : ces réglages sont prioritaires.

# --- S1 : connexion par clé uniquement ------------------------------------------
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# --- S2 : connexion de root interdite -------------------------------------------
PermitRootLogin no

# --- S3 : seuls les membres du groupe acces_ssh peuvent se connecter ------------
AllowGroups acces_ssh

# --- S4 : essais limités, sessions mortes ou inactives fermées -------------------
# 3 essais par connexion (exigence : au plus 4)
MaxAuthTries 3
# 30 s pour s'authentifier, sinon la connexion est coupée
LoginGraceTime 30
# Le serveur sonde le client toutes les 5 min ; 2 sondes sans réponse
# -> connexion fermée au bout de 10 min. Cela ferme les connexions MORTES.
# Une session ouverte mais inactive est fermée par TMOUT (config/profile.d/tmout.sh).
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Réduction de surface (recommandations ANSSI) --------------------------------
X11Forwarding no
AllowAgentForwarding no
